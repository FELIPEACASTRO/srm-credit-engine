name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  golden-cases:
    name: golden-cases (suite unitaria)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Goldens, discriminantes, empates e unidades
        working-directory: backend
        run: ./mvnw --batch-mode test

  integration:
    name: integracao (PostgreSQL 17 real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Imutabilidade, idempotencia, lock, contrato HTTP e extrato
        working-directory: backend
        run: ./mvnw --batch-mode verify -Pintegration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck estrito
        run: npx tsc -b
      - name: Testes (money, corrida, chave por intencao, URL)
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build de producao
        run: npx vite build

  guards:
    name: guards (float e SQL interpolado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhum float/double/Math.pow/toFixed no caminho do dinheiro (backend)
        run: |
          HITS=$(grep -rnE '\b(double|float)\b|Math\.pow|toFixed' \
            backend/src/main/java/com/srmasset/creditengine --include='*.java' \
            | grep -v 'fx/provider' \
            | grep -vE ':[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "Float binario no caminho do dinheiro:"; echo "$HITS"; exit 1
          fi
      - name: Nenhuma concatenacao dentro de sql() (backend)
        run: |
          HITS=$(grep -rn 'sql(' backend/src/main/java --include='*.java' -A2 \
            | grep -E '"\s*\+\s*[a-zA-Z]' || true)
          if [ -n "$HITS" ]; then
            echo "SQL concatenado com variavel:"; echo "$HITS"; exit 1
          fi
      - name: Nenhum parseFloat/toFixed no frontend
        run: |
          HITS=$(grep -rnE 'parseFloat|toFixed' frontend/src \
            --include='*.ts' --include='*.tsx' \
            | grep -vE ':[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "Float no caminho do dinheiro do front:"; echo "$HITS"; exit 1
          fi

  compose-smoke:
    name: compose sobe de primeira e afere o C1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack do zero
        run: docker compose up -d --build
      - name: Espera a API ficar saudavel
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              exit 0
            fi
            sleep 3
          done
          echo "API nao subiu"; docker compose logs api | tail -50; exit 1
      - name: Simula o golden C1 pela API (ao centavo)
        run: |
          DUE=$(date -d "+3 months" +%F)
          BODY=$(curl -fsS -X POST http://localhost:8080/api/v1/simulations \
            -H 'Content-Type: application/json' \
            -d "{\"type\":\"DUPLICATA\",\"faceValue\":\"100000.00\",\"paymentCurrency\":\"BRL\",\"dueDate\":\"$DUE\"}")
          echo "$BODY"
          echo "$BODY" | grep -q '"92859.94"' || { echo "C1 fora do centavo"; exit 1; }
      - name: Web serve e o proxy /api responde
        run: |
          curl -fsS http://localhost/ | grep -qi 'SRM Credit Engine'
          curl -fsS 'http://localhost/api/v1/exchange-rates/current?base=USD&quote=BRL' \
            | grep -q '5.4321'
      - name: Derruba com volume
        if: always()
        run: docker compose down -v
