spring.application.name=credit-engine

# Datasource da APLICACAO: usuario membro de app_rw (sem UPDATE/DELETE nas tabelas append-only).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credit_engine}
spring.datasource.username=${DB_USER:credit_engine_app}
spring.datasource.password=${DB_PASSWORD:credit_engine_app}

# Migrations rodam como o DONO do schema (separacao de privilegios): o papel da app
# nao consegue criar/alterar objetos nem contornar os triggers.
spring.flyway.user=${DB_MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}

management.endpoints.web.exposure.include=health,prometheus
