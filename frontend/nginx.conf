server {
  listen 80;

  # DNS embutido do Docker (127.0.0.11) + upstream em VARIAVEL forcam o nginx a re-resolver
  # o IP do 'api' a cada request. Sem isso, o nginx fixa o IP no boot e passa a dar 502 se
  # so o container da API for recriado (novo IP) — armadilha classica em rebuild parcial.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $upstream_api api;
    proxy_pass http://$upstream_api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
