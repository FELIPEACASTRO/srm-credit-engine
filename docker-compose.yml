# Sobe tudo do zero: banco (com usuario de aplicacao restrito), API (roda as migrations
# como dono e conecta como app) e web (nginx com proxy /api).
#   docker compose up --build       ->  http://localhost  (web)  ·  http://localhost:8080/swagger-ui.html
# Reset completo: docker compose down -v

services:
  db:
    # Imagem propria com o init ASSADO (ver infra/db/Dockerfile): sem bind-mount,
    # roda em qualquer Windows sem depender do File Sharing do Docker Desktop.
    build:
      context: ./infra/db
    environment:
      POSTGRES_DB: credit_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-credit_engine_app}
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forca TCP: o socket unix fica pronto antes e daria falso "saudavel"
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_engine -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # A porta 8080 so abre no fim do startup do Spring (apos Flyway) — porta aberta ~ pronto.
      # bash + /dev/tcp: zero dependencia extra na imagem JRE (sem curl/wget).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    environment:
      DB_URL: jdbc:postgresql://db:5432/credit_engine
      DB_USER: credit_engine_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-credit_engine_app}
      # migrations rodam como dono; a aplicacao NUNCA conecta como superusuario
      DB_MIGRATION_USER: postgres
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_FX_FEEDER_ENABLED: "true"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  db-data:
