# Scrape das métricas da API (Micrometer -> /actuator/prometheus).
# 'api' resolve pelo nome do serviço na rede do compose.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: credit-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          application: credit-engine
